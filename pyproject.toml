[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ioc-enrich"
version = "0.1.0"
description = "Multi-source IOC enrichment CLI tool with weighted scoring and graph pivoting"
requires-python = ">=3.11"
dependencies = ["httpx", "typer", "rich", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[project.scripts]
ioc-enrich = "ioc_enrich.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ioc_enrich"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100